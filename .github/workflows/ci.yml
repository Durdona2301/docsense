name: CI
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg17
        env:
          POSTGRES_DB: docsense
          POSTGRES_USER: docsense
          POSTGRES_PASSWORD: docsense-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U docsense -d docsense"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DOCSENSE_TEST_DATABASE: Host=localhost;Database=docsense;Username=docsense;Password=docsense-ci-only
      ConnectionStrings__Database: Host=localhost;Database=docsense;Username=docsense;Password=docsense-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: dotnet restore --locked-mode
      - run: dotnet build -c Release --no-restore
      - run: dotnet test -c Release --no-build --logger trx --results-directory artifacts/test-results
      - run: npm ci
      - run: npm run format:check
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-evidence
          path: |
            artifacts/
            test-results/
      - run: docker build -t docsense:ci .
